name: openeval
description: "OpenEval - Open Source Chess Analysis Engine powered by Stockfish"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  uuid: ^4.2.1
  cached_network_image: ^3.3.1
  fl_chart: ^0.66.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/themes/
    - assets/pieces/
    - assets/boards/
